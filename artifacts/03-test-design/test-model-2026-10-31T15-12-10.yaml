test_cases:
  # ===== POSITIVE =====
  - id: TC-P-001
    title: "Успешный вход с Email"
    type: positive
    priority: high
    preconditions: "Пользователь зарегистрирован, имеет корректный Email и пароль"
    steps:
      - "Открыть страницу авторизации"
      - "Ввести корректный Email в поле «Логин»"
      - "Ввести корректный пароль в поле «Пароль»"
      - "Нажать кнопку «Войти»"
    expected_result: "Пользователь перенаправлен в личный кабинет (или на предыдущую страницу). Сессия активна."
    requirement_id: [REQ-2.1, REQ-2.3]

  - id: TC-P-002
    title: "Кнопка «Показать пароль»"
    type: positive
    priority: medium
    preconditions: "Пользователь на странице авторизации"
    steps:
      - "Ввести любой текст в поле «Пароль»"
      - "Нажать иконку «глаз» (показать пароль)"
    expected_result: "Символы пароля отображаются в явном виде, а не маскируются"
    requirement_id: REQ-2.1

  - id: TC-P-003
    title: "Кнопка «Скрыть пароль»"
    type: positive
    priority: medium
    preconditions: "Пользователь нажал «Показать пароль»"
    steps:
      - "Нажать иконку «глаз» повторно"
    expected_result: "Символы пароля снова маскируются"
    requirement_id: REQ-2.1

  - id: TC-P-004
    title: "Загрузка страницы авторизации"
    type: positive
    priority: high
    steps:
      - "Перейти по URL страницы авторизации"
    expected_result: "Отображаются поля «Логин» и «Пароль», кнопка «Войти», ссылки «Забыли пароль?» и «Регистрация». Присутствует логотип в корпоративных цветах."
    requirement_id: [REQ-1, REQ-4.2]

  - id: TC-P-005
    title: "Переход по ссылке «Забыли пароль?»"
    type: positive
    priority: medium
    preconditions: "Пользователь на странице авторизации"
    steps:
      - "Нажать ссылку «Забыли пароль?»"
    expected_result: "Происходит переход на страницу восстановления пароля"
    requirement_id: REQ-2.3

  - id: TC-P-006
    title: "Переход по ссылке «Регистрация»"
    type: positive
    priority: medium
    preconditions: "Пользователь на странице авторизации"
    steps:
      - "Нажать ссылку «Нет аккаунта? Зарегистрироваться»"
    expected_result: "Происходит переход на страницу регистрации"
    requirement_id: REQ-2.3

  - id: TC-P-007
    title: "Нажатие Enter в любом поле отправляет форму"
    type: positive
    priority: medium
    preconditions: "Пользователь зарегистрирован"
    steps:
      - "Ввести корректные логин и пароль"
      - "Нажать Enter в поле «Логин» (или «Пароль»)"
    expected_result: "Форма отправляется, пользователь авторизован"
    requirement_id: REQ-4.2

  - id: TC-P-008
    title: "Placeholder отображается в полях"
    type: positive
    priority: low
    preconditions: "Страница только загружена, поля пусты"
    steps:
      - "Посмотреть на поле «Логин»"
      - "Посмотреть на поле «Пароль»"
    expected_result: "В поле «Логин» отображается placeholder «Введите ваш Email» или «Введите логин». В поле «Пароль» отображается соответствующий placeholder."
    requirement_id: REQ-2.1

  - id: TC-P-009
    title: "Чекбокс «Запомнить меня»"
    type: positive
    priority: medium
    preconditions: "Функция «Запомнить меня» включена в релиз"
    steps:
      - "Отметить чекбокс «Запомнить меня»"
      - "Ввести корректные данные"
      - "Нажать «Войти»"
      - "Закрыть браузер"
      - "Открыть страницу авторизации снова"
    expected_result: "Сессия восстановлена, пользователь не требует повторного входа"
    requirement_id: REQ-2.4

  - id: TC-P-010
    title: "Выбор языка интерфейса"
    type: positive
    priority: low
    preconditions: "Функция выбора языка включена в релиз"
    steps:
      - "Нажать переключатель языка на EN"
    expected_result: "Интерфейс страницы авторизации отображается на английском языке"
    requirement_id: REQ-2.4

  - id: TC-P-011
    title: "Успешный вход с Username"
    type: positive
    priority: medium
    preconditions: "Пользователь зарегистрирован, система поддерживает Username"
    steps:
      - "Ввести корректный Username (не Email)"
      - "Ввести корректный пароль"
      - "Нажать «Войти»"
    expected_result: "Пользователь авторизован"
    requirement_id: REQ-2.1

  - id: TC-P-013
    title: "Кнопка «Войти» активна при пустых полях"
    type: positive
    priority: high
    preconditions: "Пользователь на странице авторизации. UX-концепция: кнопка активна всегда."
    steps:
      - "Оставить оба поля пустыми"
      - "Нажать кнопку «Войти»"
    expected_result: "Кнопка активна (нажимается). Под полями отображаются ошибки валидации. Кнопка не блокируется."
    requirement_id: REQ-2.2

