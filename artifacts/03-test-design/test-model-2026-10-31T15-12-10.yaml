      - "Нажать «Войти»"
    expected_result: "Запрос отклонён. Аутентификация не пройдена. Сообщение «Неверный логин или пароль». Данные экранированы."
    requirement_id: REQ-4.1

  - id: TC-N-011
    title: "XSS в поле «Логин»"
    type: negative
    priority: high
    preconditions: "Пользователь на странице авторизации"
    steps:
      - "Ввести XSS-скрипт в поле «Логин» (например, `<script>alert('XSS')</script>`)"
      - "Ввести пароль"
      - "Нажать «Войти»"
    expected_result: "Скрипт не выполняется. Ввод экранирован."
    requirement_id: REQ-4.1

  - id: TC-N-012
    title: "Двойной клик по кнопке «Войти» (Double Submit)"
    type: negative
    priority: medium
    preconditions: "Пользователь зарегистрирован"
    steps:
      - "Ввести корректные данные"
      - "Быстро нажать кнопку «Войти» дважды"
    expected_result: "Отправлен только один запрос. Второе нажатие проигнорировано (кнопка заблокирована спиннером)."
    requirement_id: REQ-2.2

  - id: TC-N-013
    title: "Превышение лимита попыток (Rate Limiting)"
    type: negative
    priority: high
    preconditions: "Пользователь на странице авторизации"
    steps:
      - "Ввести неверные данные N раз (N = лимит попыток)"
      - "На N+1 раз ввести корректные данные"
    expected_result: "После N неудачных попыток включается CAPTCHA или временная блокировка. Даже корректные данные не принимаются до прохождения CAPTCHA/окончания блокировки."
    requirement_id: REQ-3

  - id: TC-N-014
    title: "Отправка формы с пробелами в полях"
    type: negative
    priority: medium
    preconditions: "Пользователь на странице авторизации"
    steps:
      - "Ввести пробелы в поле «Логин»"
      - "Ввести пробелы в поле «Пароль»"
      - "Нажать «Войти»"
    expected_result: "Валидация отклоняет пробелы как невалидный ввод, или сервер обрабатывает их как пустые значения. Форма не отправляется."
    requirement_id: [REQ-2.1, REQ-3]

  - id: TC-N-015
    title: "CSRF-атака (отсутствие/невалидный токен)"
    type: negative
    priority: high
    preconditions: "Злоумышленник пытается отправить форму с поддельным запросом"
    steps:
      - "Отправить POST-запрос на endpoint авторизации без CSRF-токена"
      - "Отправить POST-запрос с невалидным CSRF-токеном"
    expected_result: "Оба запроса отклонены с ошибкой 403 Forbidden"
    requirement_id: REQ-4.1

  - id: TC-N-016
    title: "Отправка пароля через GET"
    type: negative
    priority: high
    preconditions: ""
    steps:
      - "Попытаться отправить данные авторизации через GET-запрос (с параметрами в URL)"
    expected_result: "GET-запрос отклонён. Данные принимаются только через POST."
    requirement_id: REQ-4.1

