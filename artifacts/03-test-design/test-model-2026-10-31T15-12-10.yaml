  - id: TC-N-009
    title: "Таймаут соединения"
    type: negative
    priority: medium
    preconditions: "Сервер не отвечает (таймаут)"
    steps:
      - "Ввести корректные данные"
      - "Нажать «Войти»"
    expected_result: "Отображается сообщение об ошибке соединения. Кнопка разблокируется."
    requirement_id: REQ-3

  - id: TC-N-010
    title: "SQL-инъекция в поле «Логин»"
    type: negative
    priority: high
    preconditions: "Пользователь на странице авторизации"
    steps:
      - "Ввести SQL-инъекцию в поле «Логин» (например, `' OR 1=1 --`)"
