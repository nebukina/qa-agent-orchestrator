quality_gate_qg3:
  verdict: "PASS"
  verdict_reason: "Все критерии выполнены: кейсы опубликованы в Redmine (20/20, #88–#107) после снятия внешнего блокера (MCP-обёртка отклоняла запись; публикация выполнена оркестратором прямым REST). Проектировочные критерии 1–5 были выполнены изначально."
  checks:
    - { name: ">=1 positive на проектируемое требование", result: "PASS_WITH_WAIVERS", detail: "Positive есть для FR-001, FR-002, FR-003, FR-004, FR-005, FR-007, FR-008, AC-1 (8 шт.). Для FR-006, FR-009, FR-010, AC-2, AC-3 нормативное утверждение по построению негативное - positive-аспект делегирован (TC-014 / TC-006) либо отсутствует нормативно; fabrication запрещён (WAIVER_NEGATIVE_BY_CONSTRUCTION)" }
    - { name: ">=1 negative для операций записи", result: "PASS", detail: "Вход = операция записи/аутентификации (POST /api/login). Negative: TC-009, TC-010, TC-011, TC-012, TC-013 (5 шт.)" }
