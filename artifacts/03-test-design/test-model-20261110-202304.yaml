gaps:
  - id: "GAP-TD-01"
    kind: "REDMINE_CONTEXT_MISSING / WRITE_403"
    severity: "blocker-for-publication"
    summary: "Текущий API-ключ (REDMINE_KEY -> REDMINE_API_KEY, инстанс http://localhost:3000) не имеет прав на запись: create_issue, update_issue, add_note -> 403 детерминированно (16 попыток, 2 проекта, минимальные пейлоады, ретрай). Также недоступны чтения users / current_user / custom_fields."
    impact: "Ни один тест-кейс и ни одна GAP-заглушка физически не могли быть созданы. Redmine ID отсутствуют; выдумывание ID запрещено."
    action_required: "Выдать ключу право add_issue (и journals/users/current_user) в проекте login ЛИБО запустить публикацию ключом с правом записи - модель готова к механической публикации (пейлоады в test-model-20261110-202304.md)"
    evidence: "artifacts/errors/redmine-permission-20261110-202304.md"
    resolution: "RESOLVED (оркестратор, 2026-11-10): отказ 403 генерировала MCP-обёртка redmine-инструментов; прямой Redmine REST под тем же ключом принимает запись. Все 20 единиц опубликованы (#88–#107), redmine_id проставлены в этом YAML и в .md."
  - id: "GAP-TD-02"
    kind: "BOUNDARY_AMBIGUOUS"
    severity: "minor"
    summary: "Граница «заполнено/пусто» не определена по включительности (пробельный ввод): AMB-10 / OQ-01. Кейс на пробельный ввод не создавался (изобретение ожидания запрещено); зафиксирован только TC-014 (1 символ = заполнено)."
  - id: "GAP-TD-03"
    kind: "NO_NORMATIVE_NUMERIC_LIMITS"
    severity: "minor"
    summary: "Числовые лимиты (длина пароля/email, максимумы) в #72 нормативно отсутствуют (GAP-22 / OQ-09) -> boundary-матрица по boundary_offsets неприменима; boundary_offsets в конфигурации прогона не задан."
  - id: "GAP-TD-04"
    kind: "NON_DETERMINISTIC"
    severity: "major"
    summary: "AC-4 недетерминирован (Given «сервер недоступен (возвращает 500)» смешивает HTTP 500 и отказ сети) -> кейс не создаётся, оформлен STUB-01 (BLOCKED_BY_OPEN_QUESTION)."
  - id: "GAP-TD-05"
    kind: "PRECOND_DERIVED"
    severity: "major"
    summary: "Предусловия и тестовые данные выведены агентом (GAP-17): используются плейсхолдеры <LOGIN_PAGE_URL>, <EMAIL_VALID>, <PASSWORD_CORRECT>, <PASSWORD_WRONG>. Кейсы станут исполнимыми после закрытия OQ-12 (маршрут) и OQ-03 (сиды учётных записей)."
  - id: "GAP-TD-06"
