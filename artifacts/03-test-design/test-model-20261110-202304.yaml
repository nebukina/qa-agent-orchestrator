    - { name: "у всех кейсов есть requirement_id и expected_result", result: "PASS", detail: "Все 14 кейсов имеют пару (report_ts, requirement_id) и непустой expected_result. GAP-заглушки (6) содержат явный маркер n/a и НЕ содержат изобретённых ожиданий - по правилу конвейера при CONDITIONAL" }
    - { name: "нет дублей существующих кейсов в Redmine", result: "PASS", detail: "Дедупликация выполнена до записи: в проекте login до прогона существовал только #72; [TC]-кейсов не было (list_issues + search). Внутренние пересечения TC-009/TC-010 и TC-011/TC-012 разведены разными конфигурациями входа и слоями проверки" }
